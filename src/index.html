<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html {
      box-sizing: border-box;
      font-size: 16px; 
    }
    *, *:before, *:after {
      box-sizing: inherit;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 1.25rem;
      line-height: 1.5;
    }
    .container {
      background-color: white;
      padding: 1.25rem;
      border-radius: 0.5rem;
      box-shadow: 0 0.25rem 0.75rem rgba(0, 0, 0, 0.08);
      width: 100%;
      margin: auto;
    }
    h2 {
      text-align: center;
      color: #2c3e50;
      margin-top: 0;
      margin-bottom: 0.5rem;
      font-size: clamp(1.25rem, 5vw, 1.5rem);
    }
    .logo-png {
      display: block;
      margin: 0 auto 0.5rem; 
      width: 5rem;         
      height: 5rem;
      object-fit: contain; 
    }
    .info-bar { 
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #f1f3f5;
      padding: 0.6rem 0.85rem;
      border-radius: 0.375rem;
      margin-bottom: 1rem;
      font-size: 0.9rem;
    }
    .info-left {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .status-badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge-open {
      background-color: #d4edda;
      color: #155724;
    }
    .badge-closed {
      background-color: #f8d7da;
      color: #721c24;
    }
    .btn-sync {
      width: auto;
      margin: 0;
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 600;
      background-color: #6c757d;
      border-radius: 0.25rem;
    }
    .btn-sync:hover {
      background-color: #5a6268;
    }
    .btn-group {
      display: flex;
      gap: 0.5rem;
    }
    .btn-group button {
      flex: 1;
    }
    .btn-secondary {
      background-color: #6c757d;
    }
    .btn-secondary:hover {
      background-color: #5a6268;
    }
    label {
      font-size: 0.95rem;
      font-weight: 600;
      margin-top: 1rem;
      margin-bottom: 0.35rem;
      display: block;
      color: #34495e;
    }
    input[type="number"], input[type="text"] {
      width: 100%;
      padding: 0.65rem 0.75rem;
      margin-bottom: 0.35rem;
      border: 1px solid #bdc3c7;
      border-radius: 0.375rem;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      outline: none;
      border-color: #007bff;
      box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.2);
    }
    button {
      background-color: #007bff;
      color: white;
      padding: 0.65rem 1.25rem;
      border: none;
      border-radius: 0.375rem;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: background-color 0.2s, opacity 0.2s;
      width: 100%;
      margin-top: 0.35rem; 
    }
    button:hover { background-color: #0056b3; }
    button:disabled {
      background-color: #5a9ed8;
      cursor: not-allowed;
      opacity: 0.7;
    }
    p {
      margin: 0.25rem 0;
      color: #7f8c8d;
      font-size: 0.85rem;
    }
    .current-value {
      font-weight: 600;
      color: #007bff;
    }
    #status {
      text-align: center;
      font-weight: bold;
      min-height: 1.5rem;
      margin-bottom: 0.75rem;
      font-size: 0.9rem;
    }

    /* Modal dialog */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      display: none; justify-content: center; align-items: center;
      z-index: 1000; padding: 1rem;
    }
    .modal-content {
      background: white; padding: 1.5rem; border-radius: 0.5rem;
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.3);
      width: 100%; max-width: 25rem; text-align: center;
    }
    .modal-content h3 { margin-top: 0; color: #c0392b; }
    .modal-content p { color: #34495e; font-size: 1rem; }
    .modal-content button {
      margin-top: 1rem; background-color: #c0392b; width: auto; padding: 0.5rem 1.5rem;
    }
    .modal-content button:hover { background-color: #a93226; }
  </style>
</head>

    <div class="info-bar">
      <div class="info-left">
        <span><strong>Responses:</strong> <span class="current-value" id="currentResponseCount"><?= currentResponses ?></span></span>
        <span id="formStatusBadge" class="status-badge <?= isAccepting ? 'badge-open' : 'badge-closed' ?>">
          <?= isAccepting ? '● Open' : '● Closed' ?>
        </span>
      </div>
      <button id="syncBtn" class="btn-sync" onclick="syncCount()" title="Recalibrate response count and status from Google Forms">🔄 Sync</button>
    </div>

    <div id="status"></div>

    <div>
      <label for="limit">Set Response Limit:</label>
      <input type="number" id="limit" min="1" placeholder="Leave empty to remove" value="<?= maxResponses === 'Not set' ? '' : maxResponses ?>" onkeydown="if(event.key === 'Enter') setLimit()">
      <div class="btn-group">
        <button onclick="setLimit()">Save Limit</button>
        <button type="button" class="btn-secondary" onclick="disableLimit()">Remove Limit</button>
      </div>
      <p><strong>Current:</strong> <span class="current-value" id="currentLimit"><?= maxResponses ?></span></p>
    </div>
    
    <div>
      <label for="confirmationMessage">Confirmation Message:</label>
      <input type="text" id="confirmationMessage" value="<?= confirmationMessage ?>" onkeydown="if(event.key === 'Enter') setMessage()">
      <button onclick="setMessage()">Update Confirmation</button>
      <p><strong>Current:</strong> <span class="current-value" id="currentConfirmationMessage"><?= confirmationMessage ?></span></p>
    </div>

    <div>
      <label for="closedMessage">Message when form is closed:</label>
      <input type="text" id="closedMessage" value="<?= closedMessage ?>" onkeydown="if(event.key === 'Enter') setClosedMessage()">
      <button onclick="setClosedMessage()">Update Closed Message</button>
      <p><strong>Current:</strong> <span class="current-value" id="currentClosedMessage"><?= closedMessage ?></span></p>
    </div>
  </div>

  <div id="errorModal" class="modal-overlay">
    <div class="modal-content">
      <h3>Error Occurred</h3>
      <p id="errorMessage"></p>
      <button onclick="closeErrorModal()">Close</button>
    </div>
  </div>

  <script>
    function updateStatusBadge(isAccepting) {
      var badge = document.getElementById("formStatusBadge");
      if (!badge) return;
      if (isAccepting) {
        badge.className = "status-badge badge-open";
        badge.textContent = "● Open";
      } else {
        badge.className = "status-badge badge-closed";
        badge.textContent = "● Closed";
      }
    }

    function handleSuccess(msg, callback) {
      var statusDiv = document.getElementById("status");
      statusDiv.style.color = 'green';
      statusDiv.textContent = msg;
      if (callback) callback();
      setButtonsDisabled(false);
      setTimeout(function() { statusDiv.textContent = ''; }, 3500);
    }

    function handleFailure(error) {
      var message = (typeof error === 'string') ? error : (error && error.message ? error.message : 'An unexpected error occurred.');
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorModal').style.display = 'flex';
      setButtonsDisabled(false);
    }
    
    function closeErrorModal() {
      document.getElementById('errorModal').style.display = 'none';
    }

    function setButtonsDisabled(disabled) {
      document.querySelectorAll('.container button').forEach(function(button) {
        button.disabled = disabled;
      });
    }

    function syncCount() {
      var syncBtn = document.getElementById("syncBtn");
      setButtonsDisabled(true);
      syncBtn.textContent = "Syncing...";
      google.script.run
        .withSuccessHandler(function(res) {
          syncBtn.textContent = "🔄 Sync";
          if (res && typeof res === 'object') {
            document.getElementById("currentResponseCount").textContent = res.count;
            updateStatusBadge(res.isAccepting);
            handleSuccess("Responses synced: " + res.count);
          } else {
            document.getElementById("currentResponseCount").textContent = res;
            handleSuccess("Responses synced: " + res);
          }
        })
        .withFailureHandler(function(err) {
          syncBtn.textContent = "🔄 Sync";
          handleFailure(err);
        })
        .syncResponseCount();
    }

    function setLimit() {
      var limitInput = document.getElementById("limit");
      var limitVal = limitInput.value.trim();

      // Client-side validation: prevent negative or invalid numbers before network call
      if (limitVal !== "") {
        var num = parseInt(limitVal, 10);
        if (isNaN(num) || num <= 0) {
          handleFailure("Please enter a valid number greater than zero, or leave empty to remove the limit.");
          return;
        }
      }

      setButtonsDisabled(true);
      google.script.run
        .withSuccessHandler(function(res) {
          var msg = (typeof res === 'object' && res.message) ? res.message : res;
          if (typeof res === 'object' && typeof res.isAccepting === 'boolean') {
            updateStatusBadge(res.isAccepting);
          }
          handleSuccess(msg, function() {
            document.getElementById("currentLimit").textContent = limitVal ? limitVal : "Not set";
            if (!limitVal) {
              limitInput.value = "";
            }
          });
        })
        .withFailureHandler(handleFailure)
        .setMaxResponses(limitVal);
    }

    function disableLimit() {
      setButtonsDisabled(true);
      google.script.run
        .withSuccessHandler(function(res) {
          var msg = (typeof res === 'object' && res.message) ? res.message : res;
          if (typeof res === 'object' && typeof res.isAccepting === 'boolean') {
            updateStatusBadge(res.isAccepting);
          }
          handleSuccess(msg, function() {
            document.getElementById("limit").value = "";
            document.getElementById("currentLimit").textContent = "Not set";
          });
        })
        .withFailureHandler(handleFailure)
        .removeLimit();
    }

    function setMessage() {
      var messageInput = document.getElementById("confirmationMessage");
      var messageVal = messageInput.value.trim();

      // Client-side validation
      if (!messageVal) {
        handleFailure("Confirmation message cannot be empty.");
        return;
      }

      setButtonsDisabled(true);
      google.script.run
        .withSuccessHandler(function(res) {
          var msg = (typeof res === 'object' && res.message) ? res.message : res;
          if (typeof res === 'object' && typeof res.isAccepting === 'boolean') {
            updateStatusBadge(res.isAccepting);
          }
          handleSuccess(msg, function() {
            document.getElementById("currentConfirmationMessage").textContent = messageVal;
          });
        })
        .withFailureHandler(handleFailure)
        .setConfirmationMessage(messageVal);
    }

    function setClosedMessage() {
      var messageInput = document.getElementById("closedMessage");
      var messageVal = messageInput.value.trim();

      // Client-side validation
      if (!messageVal) {
        handleFailure("Closed form message cannot be empty.");
        return;
      }

      setButtonsDisabled(true);
      google.script.run
        .withSuccessHandler(function(res) {
          var msg = (typeof res === 'object' && res.message) ? res.message : res;
          if (typeof res === 'object' && typeof res.isAccepting === 'boolean') {
            updateStatusBadge(res.isAccepting);
          }
          handleSuccess(msg, function() {
            document.getElementById("currentClosedMessage").textContent = messageVal;
          });
        })
        .withFailureHandler(handleFailure)
        .setClosedMessage(messageVal);
    }
  </script>
</body>
</html>
